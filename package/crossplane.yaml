apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-minio
  annotations:
    meta.crossplane.io/maintainer: Ross Golder
    meta.crossplane.io/source: github.com/rossigee/provider-minio
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Crossplane provider to manage MinIO object storage services in Kubernetes.
    meta.crossplane.io/readme: |
      `provider-minio` is a Crossplane infrastructure provider for
      [MinIO](https://www.min.io/) object storage.

      Managed resources are `minio.m.crossplane.io/v1beta1` namespaced (Bucket, Policy, User, ServiceAccount, NotificationConfiguration) with a cluster-scoped `ProviderConfig` (`minio.crossplane.io/v1`).

      Available resources and their fields can be found in the CRDs (`package/crds/`) and `docs/API.md`.
      If you encounter an issue please create an issue in the
      [rossigee/provider-minio](https://github.com/rossigee/provider-minio/issues) repo.
spec:
  permissionRequests:
    - apiGroups:
      - minio.crossplane.io
      resources:
      - providerconfigs
      - providerconfigs/status
      - providerconfigusages
      - providerconfigusages/status
      verbs:
      - "*"
    - apiGroups:
      - minio.m.crossplane.io
      resources:
      - buckets
      - buckets/status
      - policies
      - policies/status
      - serviceaccounts
      - serviceaccounts/status
      - users
      - users/status
      - notificationconfigurations
      - notificationconfigurations/status
      verbs:
      - "*"
    - apiGroups:
      - ""
      resources:
      - secrets
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - events.k8s.io
      resources:
      - events
      verbs:
      - "*"
  controller: {}
  crossplane:
    version: ">=v2.0.0-0"
