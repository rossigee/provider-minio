---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
---
apiVersion: minio.m.crossplane.io/v1beta1
kind: ServiceAccount
metadata:
  name: test-serviceaccount
spec:
  providerConfigRef:
    name: provider-config
    kind: ProviderConfig
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: ReconcileSuccess
  atProvider:
    # MinIO reports the service account status as "on". It is not "enabled",
    # which is the value madmin uses for users.
    accountStatus: "on"
